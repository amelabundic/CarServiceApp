name: Build and deploy ASP.Net Core app to Azure Web App - autocentarbundic-app

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish

      - name: Zip published app
        run: Compress-Archive -Path ./publish/* -DestinationPath ./app.zip

      - name: Upload artifact for deploy
        uses: actions/upload-artifact@v4
        with:
          name: net-app
          path: ./app.zip

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: net-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'autocentarbundic-app'
          slot-name: 'Production'
          package: ./app.zip
